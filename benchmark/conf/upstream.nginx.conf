worker_processes {{UPSTREAM_WORKERS}};
daemon on;
master_process on;
error_log logs/error.log error;
pid logs/nginx.pid;

events {
    worker_connections 65535;
}

# The mock peer. It is deliberately over-provisioned relative to the single
# pinned target worker: any measurement where this side is the bottleneck is
# measuring this file rather than the client under test.
http {
    access_log off;

    # A client keepalive pool is only worth measuring if the peer keeps its end
    # of the connection open. At the stock keepalive_requests the upstream would
    # close every connection after 1000 requests and the client pools would
    # spend the run reconnecting.
    keepalive_requests 1000000;
    keepalive_timeout 300s;

    lua_shared_dict bench_stats 1m;

    init_by_lua_block {
        benchmark_response_body = string.rep("x", {{RESPONSE_SIZE}})

        -- 40 response headers, for the response-header-count axis
        benchmark_headers40 = {}
        for i = 1, 40 do
            benchmark_headers40[i] = { string.format("X-H-%02d", i),
                                       string.rep("h", 24) }
        end

        -- a Set-Cookie-heavy response: one name arriving ten times, which is
        -- the shape that makes the client fold repeated headers into an array
        benchmark_cookies = {}
        for i = 1, 10 do
            benchmark_cookies[i] = string.format(
                "bench%02d=%s; Path=/; HttpOnly", i, string.rep("c", 24))
        end
    }

    # Connection and request counters. The runner reads these before and after
    # each case: requests-per-connection at or near 1 means the client pool is
    # not reusing anything, which invalidates every keepalive case. Counting
    # here rather than on the target keeps the check off the measured worker's
    # hot path entirely.
    init_worker_by_lua_block {
        local stats = ngx.shared.bench_stats

        function benchmark_count()
            stats:incr("requests", 1, 0)

            if ngx.var.connection_requests == "1" then
                stats:incr("connections", 1, 0)
            end
        end
    }

    server {
        listen 127.0.0.1:{{UPSTREAM_PORT}};
        listen 127.0.0.1:{{UPSTREAM_TLS_PORT}} ssl;

        ssl_certificate tls.crt;
        ssl_certificate_key tls.key;
        ssl_session_cache shared:bench_ssl:10m;
        ssl_session_timeout 10m;

        # Content-Length framed, the reference response shape.
        location = /mock {
            content_by_lua_block {
                benchmark_count()

                local body = benchmark_response_body
                ngx.header["Content-Length"] = #body
                ngx.header["X-Benchmark-Upstream"] = "mock"
                ngx.print(body)
            }
        }

        # Same response, but reads a request body first: the POST axis.
        location = /mock/sink {
            content_by_lua_block {
                benchmark_count()

                ngx.req.read_body()

                local body = benchmark_response_body
                ngx.header["Content-Length"] = #body
                ngx.header["X-Benchmark-Upstream"] = "sink"
                ngx.print(body)
            }
        }

        # No Content-Length, so nginx frames the body with chunked encoding.
        location = /mock/chunked {
            content_by_lua_block {
                benchmark_count()

                ngx.header["X-Benchmark-Upstream"] = "chunked"
                ngx.print(benchmark_response_body)
            }
        }

        location = /mock/headers40 {
            content_by_lua_block {
                benchmark_count()

                local h = ngx.header
                for i = 1, #benchmark_headers40 do
                    local pair = benchmark_headers40[i]
                    h[pair[1]] = pair[2]
                end

                local body = benchmark_response_body
                h["Content-Length"] = #body
                ngx.print(body)
            }
        }

        location = /mock/cookies {
            content_by_lua_block {
                benchmark_count()

                ngx.header["Set-Cookie"] = benchmark_cookies

                local body = benchmark_response_body
                ngx.header["Content-Length"] = #body
                ngx.print(body)
            }
        }

        # Echoes back the raw request header block exactly as received. The
        # runner's fairness audit diffs the two columns of a pair against this:
        # if the bytes differ, the pair is not measuring the same request.
        location = /mock/echo {
            content_by_lua_block {
                local raw = ngx.req.raw_header()
                ngx.header["Content-Length"] = #raw
                ngx.header["Content-Type"] = "text/plain"
                ngx.print(raw)
            }
        }

        location = /stats {
            content_by_lua_block {
                local stats = ngx.shared.bench_stats
                ngx.say("connections ", stats:get("connections") or 0)
                ngx.say("requests ", stats:get("requests") or 0)
            }
        }

        location = /stats/reset {
            content_by_lua_block {
                local stats = ngx.shared.bench_stats
                stats:set("connections", 0)
                stats:set("requests", 0)
                ngx.say("ok")
            }
        }

        location = /ready {
            return 200 "ok\n";
        }
    }
}

# Trailers cannot be emitted from the http subsystem, so the trailer case gets a
# raw TCP mock that writes exact response bytes: chunked framing, then a trailer
# section behind the terminating chunk. It answers on a keepalive loop so the
# client pool behaves the same as it does against the http mock.
stream {
    init_by_lua_block {
        local body = string.rep("x", {{RESPONSE_SIZE}})

        benchmark_trailer_response = table.concat({
            "HTTP/1.1 200 OK\r\n",
            "X-Benchmark-Upstream: trailers\r\n",
            "Trailer: X-Checksum\r\n",
            "Transfer-Encoding: chunked\r\n",
            "\r\n",
            string.format("%x\r\n", #body), body, "\r\n",
            "0\r\n",
            "X-Checksum: abc123\r\n",
            "\r\n",
        })
    }

    server {
        listen 127.0.0.1:{{UPSTREAM_TRAILER_PORT}};

        content_by_lua_block {
            local sock = ngx.req.socket()
            sock:settimeout(300000)

            local resp = benchmark_trailer_response
            -- one receive per request rather than one per header line: this mock
            -- has to keep up with a saturated target worker
            local read_head = sock:receiveuntil("\r\n\r\n")

            while true do
                local head, err = read_head()
                if not head then
                    return
                end

                local ok
                ok, err = sock:send(resp)
                if not ok then
                    return
                end
            end
        }
    }
}
