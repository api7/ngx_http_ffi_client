worker_processes 1;
daemon on;
master_process on;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 65535;
}

http {
    lua_package_path "{{LUA_PACKAGE_PATH}};;";
    access_log off;

    init_by_lua_block {
        benchmark_upstream_host = "127.0.0.1"
        benchmark_upstream_port = {{UPSTREAM_PORT}}
        benchmark_keepalive_pool_size = {{KEEPALIVE_POOL_SIZE}}
        benchmark_keepalive_idle_timeout = {{KEEPALIVE_IDLE_TIMEOUT}}
        benchmark_response_body = string.rep("x", {{RESPONSE_SIZE}})
    }

    server {
        listen 127.0.0.1:{{TARGET_PORT}};

        location = /ready {
            content_by_lua_block {
                local ok_ffi, ffi_err = pcall(require, "resty.ngx_http_ffi_client")
                local ok_http, http_err = pcall(require, "resty.http")

                if not ok_ffi then
                    ngx.status = 500
                    ngx.say("resty.ngx_http_ffi_client: " .. tostring(ffi_err))
                    return
                end

                if not ok_http then
                    ngx.status = 500
                    ngx.say("resty.http: " .. tostring(http_err))
                    return
                end

                ngx.say("ok")
            }
        }

        location = /gc {
            content_by_lua_block {
                ngx.say(collectgarbage("count"))
            }
        }

        location = /bench/baseline {
            content_by_lua_block {
                local body = benchmark_response_body
                ngx.header["Content-Length"] = #body
                ngx.print(body)
            }
        }

        location = /smoke/ffi-short {
            content_by_lua_block {
                local client = require "resty.ngx_http_ffi_client"
                local res, err = client.request_uri({
                    scheme = "http",
                    host = benchmark_upstream_host,
                    port = benchmark_upstream_port,
                    method = "GET",
                    path = "/mock",
                    headers = {
                        ["X-Benchmark-Case"] = "ffi-short",
                    },
                })

                if not res then
                    ngx.status = 502
                    ngx.say(err)
                    return
                end

                ngx.status = res.status
                ngx.print(res.body)
            }
        }

        location = /smoke/resty-http-short {
            content_by_lua_block {
                local http = require "resty.http"
                local httpc, err = http.new()
                if not httpc then
                    ngx.status = 502
                    ngx.say(err)
                    return
                end

                httpc:set_timeout(60000)

                local ok
                ok, err = httpc:connect(benchmark_upstream_host, benchmark_upstream_port)
                if not ok then
                    ngx.status = 502
                    ngx.say(err)
                    return
                end

                local res
                res, err = httpc:request({
                    method = "GET",
                    path = "/mock",
                    headers = {
                        ["Host"] = benchmark_upstream_host,
                        ["X-Benchmark-Case"] = "resty-http-short",
                    },
                })
                if not res then
                    ngx.status = 502
                    ngx.say(err)
                    return
                end

                local body
                body, err = res:read_body()
                httpc:close()
                if not body then
                    ngx.status = 502
                    ngx.say(err)
                    return
                end

                ngx.status = res.status
                ngx.print(body)
            }
        }

        location = /bench/ffi {
            content_by_lua_block {
                local client = require "resty.ngx_http_ffi_client"
                local res, err = client.request_uri({
                    scheme = "http",
                    host = benchmark_upstream_host,
                    port = benchmark_upstream_port,
                    method = "GET",
                    path = "/mock",
                    headers = {
                        ["X-Benchmark-Case"] = "ffi-keepalive",
                    },
                    keepalive = {
                        pool = "benchmark-ffi",
                        idle_timeout = benchmark_keepalive_idle_timeout,
                        pool_size = benchmark_keepalive_pool_size,
                    },
                })

                if not res then
                    ngx.status = 502
                    ngx.say(err)
                    return
                end

                ngx.status = res.status
                ngx.header["X-Benchmark-Reused"] = tostring(res.reused)
                ngx.print(res.body)
            }
        }

        location = /bench/resty-http {
            content_by_lua_block {
                local http = require "resty.http"
                local httpc, err = http.new()
                if not httpc then
                    ngx.status = 502
                    ngx.say(err)
                    return
                end

                httpc:set_timeout(60000)

                local ok
                ok, err = httpc:connect(benchmark_upstream_host, benchmark_upstream_port)
                if not ok then
                    ngx.status = 502
                    ngx.say(err)
                    return
                end

                local res
                res, err = httpc:request({
                    method = "GET",
                    path = "/mock",
                    headers = {
                        ["Host"] = benchmark_upstream_host,
                        ["X-Benchmark-Case"] = "resty-http-keepalive",
                    },
                })
                if not res then
                    ngx.status = 502
                    ngx.say(err)
                    return
                end

                local body
                body, err = res:read_body()
                if not body then
                    ngx.status = 502
                    ngx.say(err)
                    return
                end

                local ok_keepalive, keepalive_err =
                    httpc:set_keepalive(benchmark_keepalive_idle_timeout,
                                        benchmark_keepalive_pool_size)
                if not ok_keepalive then
                    ngx.log(ngx.ERR, "resty.http set_keepalive failed: ",
                            keepalive_err)
                end

                ngx.status = res.status
                ngx.print(body)
            }
        }
    }
}
