worker_processes 1;
daemon on;
master_process on;
error_log logs/error.log error;
pid logs/nginx.pid;

events {
    worker_connections 65535;
}

http {
    lua_package_path "{{LUA_PACKAGE_PATH}};;";
    access_log off;

    # The downstream leg is common to every case including the baseline, so it
    # must not introduce churn of its own: at tens of thousands of requests per
    # second the stock keepalive_requests would recycle wrk's connections
    # hundreds of times per run and charge the accept path to whichever case was
    # running.
    keepalive_requests 1000000;
    keepalive_timeout 300s;

    resolver {{RESOLVER}} ipv6=off;
    resolver_timeout 5s;

    # resty.http verifies against the cosocket trust store, which is per-worker
    # config rather than per-request. The FFI client is handed the same file as
    # ssl_trusted_certificate, so the verify-on cases ask both clients to check
    # the identical chain against the identical root.
    lua_ssl_trusted_certificate {{CA_FILE}};
    lua_ssl_verify_depth 5;

    init_by_lua_block {
        local bench = require "bench"

        bench.init({
            host = "{{UPSTREAM_HOST}}",
            port = {{UPSTREAM_PORT}},
            tls_port = {{UPSTREAM_TLS_PORT}},
            trailer_port = {{UPSTREAM_TRAILER_PORT}},
            dns_host = "{{DNS_HOST}}",
            tls_server_name = "{{TLS_SERVER_NAME}}",
            ca_file = "{{CA_FILE}}",
            pool_size = {{KEEPALIVE_POOL_SIZE}},
            idle_timeout = {{KEEPALIVE_IDLE_TIMEOUT}},
            timeout = {{CLIENT_TIMEOUT}},
            response_body = string.rep("x", {{RESPONSE_SIZE}}),
        })
    }

    server {
        listen 127.0.0.1:{{TARGET_PORT}};

        location = /ready {
            content_by_lua_block {
                local ok_ffi, ffi_err = pcall(require, "resty.ngx_http_ffi_client")
                local ok_http, http_err = pcall(require, "resty.http")
                local ok_bench, bench_err = pcall(require, "bench")

                if not ok_ffi then
                    ngx.status = 500
                    ngx.say("resty.ngx_http_ffi_client: " .. tostring(ffi_err))
                    return
                end

                if not ok_http then
                    ngx.status = 500
                    ngx.say("resty.http: " .. tostring(http_err))
                    return
                end

                if not ok_bench then
                    ngx.status = 500
                    ngx.say("bench: " .. tostring(bench_err))
                    return
                end

                ngx.say("ok")
            }
        }

        # The case table as the worker actually sees it. The runner diffs this
        # against benchmark/cases.txt, so a case added to one and not the other
        # fails the smoke check instead of silently going unmeasured.
        location = /cases {
            content_by_lua_block {
                local bench = require "bench"
                ngx.say(table.concat(bench.case_names(), "\n"))
            }
        }

        location = /gc {
            content_by_lua_block {
                ngx.say(collectgarbage("count"))
            }
        }

        # Per-request Lua heap delta: allocate-free the case once, then measure
        # the next call against a settled heap. Diagnostic on its own, but the
        # library's claim is that response handling stays in C, and the header
        # arrays and the case-insensitive metatable are exactly where that could
        # regress, so the runner records it as a reported metric.
        location ~ ^/gcdelta/(?<bench_case>[a-z0-9._-]+)$ {
            content_by_lua_block {
                local bench = require "bench"
                local name = ngx.var.bench_case

                bench.audit(name)

                collectgarbage("collect")
                collectgarbage("collect")

                local before = collectgarbage("count")
                local n = 20

                for _ = 1, n do
                    bench.audit(name)
                end

                local after = collectgarbage("count")

                ngx.say(string.format("%.3f", (after - before) / n))
            }
        }

        location ~ ^/audit/(?<bench_case>[a-z0-9._-]+)$ {
            content_by_lua_block {
                require("bench").audit(ngx.var.bench_case)
            }
        }

        location = /bench/baseline {
            content_by_lua_block {
                require("bench").baseline()
            }
        }

        # One exact location per case, generated from benchmark/cases.txt. They
        # are exact rather than a single regex location on purpose: a regex match
        # would land on the measured worker's hot path in every case.
        include bench_locations.conf;
    }
}
